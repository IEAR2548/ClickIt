services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clickit
      POSTGRES_PASSWORD: clickit
      POSTGRES_DB: clickit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickit -d clickit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: clickit-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://clickit:clickit@postgres:5432/clickit?sslmode=disable}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
