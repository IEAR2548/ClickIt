services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clickit
      POSTGRES_PASSWORD: clickit
      POSTGRES_DB: clickit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: clickit-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://clickit:clickit@postgres:5432/clickit?sslmode=disable
      - BASE_URL=http://localhost:8080
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres

volumes:
  pgdata:
